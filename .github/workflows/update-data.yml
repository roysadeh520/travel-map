# Refreshes the data files and commits them if anything changed:
#   daily  – NSC travel warnings (gov.il)
#   weekly – practical info (visa, emergency numbers, plugs…) and Jewish places (OpenStreetMap)
name: Update data
on:
  schedule:
    - cron: '0 4 * * *'   # every day, 07:00 Israel time
  workflow_dispatch:
    inputs:
      weekly:
        description: 'Also run the weekly updates'
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: NSC travel warnings
        run: node scripts/update-nsc.mjs
      - name: Practical info (Sundays or manual)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.weekly }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then node scripts/update-practical.mjs; fi
      - name: Jewish places (Sundays or manual)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.weekly }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then node scripts/update-jewish.mjs; fi
      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Update data"
          git push
