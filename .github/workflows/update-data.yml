# Refreshes data/nsc-warnings.json from gov.il every day and commits it if anything changed.
name: Update NSC travel warnings
on:
  schedule:
    - cron: '0 4 * * *'   # 07:00 Israel time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-nsc.mjs
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/nsc-warnings.json
          git diff --cached --quiet || git commit -m "Update NSC travel warnings"
          git push
