# Refreshes the data files and commits them if anything changed:
#   daily  – NSC travel warnings (gov.il)
#   weekly – practical info (visa, emergency numbers, plugs…)
#   yearly – climate normals for the heat map, the finder and the panel's weather fallback (NASA POWER)
name: Update data
on:
  schedule:
    - cron: '0 4 * * *'   # every day, 07:00 Israel time
  workflow_dispatch:
    inputs:
      weekly:
        description: 'Also run the weekly updates'
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: NSC travel warnings
        # gov.il currently blocks GitHub's data-centre IPs (HTTP 403); run scripts/update-nsc.mjs locally instead
        continue-on-error: true
        run: node scripts/update-nsc.mjs
      - name: Practical info (Sundays or manual)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.weekly }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then node scripts/update-practical.mjs; fi
      - name: Climate normals (yearly on 15 January, or manual)
        # NASA POWER's 20-year averages barely move; a yearly rebuild picks up their newest period
        continue-on-error: true
        timeout-minutes: 90   # the climate build takes ~45 min
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.weekly }}" = "true" ] || [ "$(date -u +%m%d)" = "0115" ]; then node scripts/build-climate.mjs; fi
      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet && exit 0
          git commit -m "Update data"
          git pull --rebase
          git push
