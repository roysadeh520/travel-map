<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!-- pinch-zoom allowed; text fields are 16px on phones so they don't trigger auto-zoom -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>מפת מטיילים</title>
<meta name="description" content="מדד סיכון ליהודים וישראלים, מזג אוויר, ויזה, זמני שבת ומאתר יעדים לפי תאריכים – לכל מדינה בעולם.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1d2433">
<!-- link previews (WhatsApp, Telegram, Facebook…): the image needs an absolute address – update it with a custom domain -->
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<meta property="og:site_name" content="מפת מטיילים">
<meta property="og:title" content="מפת מטיילים – בטיחות, מזג אוויר ויעדים">
<meta property="og:description" content="מדד סיכון ליהודים וישראלים, טמפרטורות ומאתר יעדים לפי התאריכים שלכם">
<meta property="og:image" content="https://roysadeh520.github.io/travel-map/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
<!-- bump ?v= on every release so browsers don't keep a stale copy (GitHub Pages caches for 10 min) -->
<link rel="stylesheet" href="style.css?v=2026100836">
<!-- usage analytics (PostHog, US cloud): page views plus the site's own events (app.js: track()).
     No session recording; every event carries site=live on GitHub Pages and site=dev on a local copy. -->
<script type="module">
  import posthog from 'https://cdn.jsdelivr.net/npm/posthog-js@1.434.13/dist/module.js';
  posthog.init('phc_wBrpg6sxMi9FX2pa6mXWwFSUjUcpeBNR4izFB29zTZTA', {
    api_host: 'https://us.i.posthog.com',
    person_profiles: 'always',   // every visitor gets a profile, so new vs returning can be measured
    disable_session_recording: true,
    // on every event, the first page view included
    before_send: e => { if (e) e.properties.site = location.hostname.endsWith('github.io') ? 'live' : 'dev'; return e; },
    loaded: ph => {
      window.posthog = ph;
      window.dispatchEvent(new Event('posthog-ready'));
    },
  });
</script>
</head>
<body>
<header class="topbar">
  <h1>🌍 מפת מטיילים</h1>
  <button id="filtersToggle" class="filters-toggle" aria-label="הסתרת הפילטרים">▲</button>

  <div class="search">
    <input id="q" type="search" autocomplete="off" placeholder="חפשו מדינה, עיר או כתובת…">
    <button id="qbtn" title="חיפוש">🔎</button>
    <ul id="results" hidden></ul>
  </div>

  <div class="layers" role="tablist">
    <button data-layer="risk" class="on">מדד סיכון</button>
    <button data-layer="temp">טמפרטורה</button>
    <button data-layer="events">אירועים</button>
  </div>
  <button id="finderBtn" class="finder-btn">🎯 מאתר יעדים</button>

  <div class="dates">
    <label>📆 <input id="range" class="range" placeholder="dd/mm/yyyy – dd/mm/yyyy" autocomplete="off"></label>
    <div class="presets">
      <button data-preset="week">השבוע</button>
      <button data-preset="nextmonth">חודש הבא</button>
      <button data-preset="december">דצמבר</button>
    </div>
  </div>
  <!-- desktop only: on a phone feedback is reached from the country card, the finder and the map corner -->
  <button id="fbBtn" class="fb-btn" data-open="feedback">💬 משוב</button>
</header>

<main>
  <div id="map"></div>
  <div class="mapbtns">
    <button id="home" title="תצוגת עולם">🌐</button>
    <button id="locate" title="המיקום שלי">📍</button>
    <button id="jewish" title="בתי כנסת ומסעדות כשרות באזור (בזום קרוב)">🕍</button>
  </div>
  <div id="legend"></div>
  <div id="intro" hidden>
    <b>💡 לחצו על מדינה כדי לראות את כל המידע עליה</b>
    <div class="intro-list">🧭 מדד סיכון · 🌤️ מזג אוויר · 🛂 ויזה · 🕯️ זמני שבת · 📅 חגים ואירועים · 💱 מטבע · ✈️ טיסות ומלונות</div>
    <button id="introOk">הבנתי</button>
    <div class="intro-about"><button class="linkbtn" data-open="about">אודות ופרטיות</button></div>
  </div>
  <div id="finder" hidden>
    <div class="f-head"><h3>🎯 מאתר יעדים</h3><button id="fShare" class="f-share" aria-label="שיתוף החיפוש"></button><button id="fMap" class="f-map" title="הצג את התוצאות על המפה (הסינון נשאר)" aria-label="הצג את התוצאות על המפה">🗺️</button><button id="fClose" title="סגירה">✕</button></div>
    <div class="f-sub">לפי התאריכים שנבחרו למעלה</div>
    <div class="f-presets">
      <button data-preset="sun" title="26°–34° ברוב הימים">☀️ חופשת שמש</button>
      <button data-preset="mild" title="16°–26° ברוב הימים">🌤️ נעים לטיולים</button>
      <button data-preset="snow" title="עד 2° ברוב הימים">❄️ שלג</button>
    </div>
    <label class="chk" title="לפי הטמפ׳ הרגילה בכל יום בטווח (ממוצע רב־שנתי) – בבירה, בערים מרכזיות במדינות גדולות וביעדי תיירות"><input type="checkbox" id="fTempOn" checked> טמפ׳ ביום בין
      <input type="number" id="fTmin" value="18" min="-30" max="45"> ל־<input type="number" id="fTmax" value="30" min="-30" max="45">°</label>
    <div class="f-pair">
    <label class="row f-days" title="לפי הטמפ׳ הרגילה בכל יום בטווח (ממוצע רב־שנתי) – בבירה, בערים מרכזיות במדינות גדולות וביעדי תיירות">ב־<select id="fDays"><option value="any">לפחות יום אחד</option><option value="most" selected>רוב הימים</option><option value="all">כל הימים</option></select></label>
    <label class="row" title="מדד הסיכון ליהודים ולישראלים">סיכון עד
      <select id="fRisk"><option value="20">נמוך</option><option value="40" selected>נמוך־בינוני</option><option value="60">בינוני</option><option value="101">הכל</option></select></label>
    </div>
    <label class="chk"><input type="checkbox" id="fVisa"> בלי ויזה מראש (פטור, בהגעה או ETA)</label>
    <label class="chk"><input type="checkbox" id="fEvents"> רק עם אירוע בתאריכים</label>
    <div id="fResults"></div>
  </div>
  <div id="toast" hidden></div>

  <!-- about & privacy / feedback window -->
  <div id="modal" hidden><div class="m-card" role="dialog" aria-modal="true"><button class="m-close" aria-label="סגירה">✕</button><div id="modalBody"></div></div></div>

  <aside id="panel" hidden>
    <button id="close" title="סגירה">✕</button>
    <div id="panelBody"></div>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/l10n/he.min.js"></script>
<script src="app.js?v=2026100836"></script>
</body>
</html>
